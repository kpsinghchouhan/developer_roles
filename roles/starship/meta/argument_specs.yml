---
# argument spec file for kpsinghchouhan.developer_roles.starship

argument_specs:
  main:
    short_description: Install the starship prompt and manage ~/.config/starship.toml.
    description:
      - Installs starship with APT on Ubuntu or with Homebrew on macOS.
      - Copies starship.toml to ~/.config for the connecting user and adds the starship init line to the rc file of the user's login shell.
    author:
      - Krishana Pal Singh Chouhan
    options:
      starship_package_state:
        type: str
        description: State of the APT or Homebrew package. Use 'latest' to upgrade an existing install.
        choices: ["present", "latest"]
        default: "present"
      starship_config_src:
        type: str
        description:
          - Source of starship.toml. A file name in the role's files/ directory, or a path on the controller.
        default: "starship.toml"
      starship_config_home:
        type: str
        description:
          - Home directory that gets .config/starship.toml and the shell rc file.
          - Defaults to the connecting user's HOME.
      starship_config_mode:
        type: str
        description: File mode of starship.toml.
        default: "0644"
      starship_shell:
        type: str
        description:
          - Shell whose rc file (~/.bashrc, ~/.zshrc) gets the starship init line.
          - Defaults to the login shell of the connecting user (the user_shell fact).
