---
# tasks file for kpsinghchouhan.linux_developer_roles.ghostty

- name: Check that the host runs macOS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "The ghostty role supports macOS only. This host is {{ ansible_facts['os_family'] }}."
    quiet: true
  tags:
    - always

- name: Install Ghostty cask with Homebrew
  community.general.homebrew_cask:
    name: "{{ __ghostty_cask_name }}"
    state: "{{ ghostty_package_state }}"
  become: false
  tags:
    - install
    - ghostty_install

- name: "Configure ghostty for user {{ ansible_facts['user_id'] }}"
  tags:
    - config
    - ghostty_config
  block:
    - name: Create the Ghostty config directory
      ansible.builtin.file:
        path: "{{ ghostty_config_home }}/.config/ghostty"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: '0755'

    - name: Copy the Ghostty config file
      ansible.builtin.copy:
        src: "{{ ghostty_config_src }}"
        dest: "{{ ghostty_config_home }}/.config/ghostty/config"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: "{{ ghostty_config_mode }}"
