---
# tasks file for kpsinghchouhan.linux_developer_roles.gh

- name: "Install GitHub CLI for {{ ansible_facts['os_family'] }}"
  ansible.builtin.include_tasks:
    file: "install_{{ ansible_facts['os_family'] | lower }}.yml"
    apply:
      tags:
        - install
        - gh_install
  tags:
    - always
