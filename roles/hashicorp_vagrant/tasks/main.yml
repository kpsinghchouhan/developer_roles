---
# tasks file for kpsinghchouhan.developer_roles.hashicorp_vagrant

- name: Check that the host runs macOS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "The hashicorp_vagrant role supports macOS only. This host is {{ ansible_facts['os_family'] }}."
    quiet: true
  tags:
    - always

- name: Install HashiCorp Vagrant cask with Homebrew
  community.general.homebrew_cask:
    name: "{{ __hashicorp_vagrant_cask_name }}"
    state: "{{ hashicorp_vagrant_package_state }}"
    sudo_password: "{{ ansible_become_password | default(omit) }}"
  become: false
  tags:
    - install
    - hashicorp_vagrant_install
