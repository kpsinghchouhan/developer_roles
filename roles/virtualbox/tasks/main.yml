---
# tasks file for kpsinghchouhan.developer_roles.virtualbox

- name: Check that the host runs macOS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "The virtualbox role supports macOS only. This host is {{ ansible_facts['os_family'] }}."
    quiet: true
  tags:
    - always

- name: Install VirtualBox cask with Homebrew
  community.general.homebrew_cask:
    name: "{{ __virtualbox_cask_name }}"
    state: "{{ virtualbox_package_state }}"
    sudo_password: "{{ ansible_become_password | default(omit) }}"
  become: false
  tags:
    - install
    - virtualbox_install
