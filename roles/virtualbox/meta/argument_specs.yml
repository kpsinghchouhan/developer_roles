---
# argument spec file for kpsinghchouhan.developer_roles.virtualbox

argument_specs:
  main:
    short_description: Install Oracle VirtualBox on macOS.
    description:
      - Installs VirtualBox with a Homebrew cask on macOS. Other platforms are not supported.
    author:
      - Krishana Pal Singh Chouhan
    options:
      virtualbox_package_state:
        type: str
        description: State of the cask. Use 'latest' to upgrade an existing install.
        choices: ["present", "latest"]
        default: "present"
